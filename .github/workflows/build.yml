version: 0.1.0
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  satellite_dart: ^1.0.2
  record: ^5.1.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
flutter:
  uses-material-design: true
